name: Update news

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update and summarize news
        env:
          BAILIAN_API_KEY: ${{ secrets.BAILIAN_API_KEY }}
          BAILIAN_BASE_URL: ${{ vars.BAILIAN_BASE_URL }}
          BAILIAN_MODEL: ${{ vars.BAILIAN_MODEL }}
        run: npm run update

      - name: Save refreshed feed
        run: |
          git config user.name "kd-daily-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/news.json data/dagu-works.json
          git diff --cached --quiet || git commit -m "chore: refresh AI news feed"
          git push
